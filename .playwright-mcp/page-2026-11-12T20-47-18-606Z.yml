        - paragraph [ref=f12e42]: Hi, I'm Emmanuel, a software engineer interested in how complex systems are designed, built, and kept reliable.
        - paragraph [ref=f12e43]: "Before moving into software, I repaired mobile phones. The work taught me to approach problems from first principles: identify the failure, understand the system around it, test an explanation, and keep working until the device functions again. That way of thinking still shapes how I write software today."
        - paragraph [ref=f12e44]:
          - text: I currently work mostly with
          - strong [ref=f12e45]: Rust
          - text: and
          - strong [ref=f12e46]: TypeScript
          - text: . Depending on the problem, I move between backend engineering, API design, developer tooling, infrastructure, and product decisions. I contribute to open source, work comfortably in Linux environments, and learn unfamiliar technologies by understanding the ideas beneath their abstractions.
        - paragraph [ref=f12e47]:
          - text: I spend much of my time studying
          - strong [ref=f12e48]: distributed systems, databases, compilers, operating systems, networking, concurrency, and performance
          - text: ". I am especially interested in the decisions that make software dependable: how data moves through a system, where failures emerge, which guarantees matter, and what should remain simple."
