    - img "Can Humanity Ever Defeat Death?" [ref=f17e40]
    - heading "Can Humanity Ever Defeat Death?" [level=1] [ref=f17e41]
    - paragraph [ref=f17e42]: Can science make dying optional or obsolete?
    - generic [ref=f17e43]:
      - generic [ref=f17e44]:
        - text: Published on
        - generic [ref=f17e45]: June 21, 2026
      - generic [ref=f17e46]: • 5 min read
      - generic [ref=f17e47]:
        - text: •
        - generic [ref=f17e48]: 2 views
    - article [ref=f17e54]:
      - generic [ref=f17e56]:
        - paragraph [ref=f17e57]:
          - emphasis [ref=f17e58]: Death Is the permanent stopping of all the vital bodily activities
          - text: "(such as the beating of the heart and working of the brain) : the end of life."
        - paragraph
        - paragraph [ref=f17e59]: Death is believed to be inevitable, and with the way technology is going now, it might come to a point where humans might be able to beat death scientifically. Can this be achieved? Or is it just a bollock?
        - paragraph
        - paragraph [ref=f17e60]:
          - strong [ref=f17e61]: Okay, stay with me…
        - paragraph
        - paragraph [ref=f17e62]:
          - text: Just recently, humans were able to edit DNA (deoxyribonucleic acid) using a bioengineering tool called
          - link "CRISPR" [ref=f17e63] [cursor=pointer]:
            - /url: https://fr.wikipedia.org/wiki/CRISPR
          - text: (CRISPR-Cas9). This technology is a revolutionary gene editing system that allows for precise, targeted modifications of DNA in living organisms.
        - paragraph [ref=f17e64]:
          - text: And yes, this is a very great achievement, which means technically we would be able to cure some cancers, sickle cell, and other diseases. As we speak scientist are still conducting research on amazing things.
          - strong [ref=f17e65]: Would Humanity be able to entirely defeat death?
          - text: Okay, this is a tough one, because even if we can defeat natural causes of death, there are still many other causes of death, one might die from drowning, accidents, natural disasters like earthquakes, and other things, so if you ask me, my answer is NOPE. Science and technology are rapidly pushing biologically limit via bioengineering, regenerative medicine, and other things. With this, we can be able to extend life span, slow ageing, and maybe redefine what it means to die.And even if science and technology were able to achieve biological immortality, they can’t escape the hypothetical death of the universe, which is called “
          - strong [ref=f17e66]: heat death of the universe,”
          - text: also known as the Big Chill/Big Freeze (In a way, you can see the naming is like a reverse of Big Bang, hahaha).
        - generic [ref=f17e67]:
          - generic [ref=f17e68]:
            - generic [ref=f17e69]: TEXT
            - button "COPY" [ref=f17e70] [cursor=pointer]
          - code [ref=f17e73]:
            - generic [ref=f17e74]: The heat death of the universe is a possible ending where the universe runs out of usable energy over an unimaginably long time, as all stars burn out, no new stars form, and everything spreads out and gets colder and darker, so that in the end the universe isn’t destroyed but becomes a thin, almost completely inactive place where nothing much can ever happen again
        - paragraph [ref=f17e75]:
          - code [ref=f17e76]
          - text: You might be wondering how this hypothesis came about. It stemmed from the
          - link "second law of thermodynamics" [ref=f17e77] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Second_law_of_thermodynamics
          - text: . (I won't write more on this, but you can check the highlighted text)
        - paragraph [ref=f17e78]:
          - code [ref=f17e79]
        - paragraph [ref=f17e80]:
          - strong [ref=f17e81]: Can/would there ever be a life without death?
          - code [ref=f17e82]
        - paragraph [ref=f17e83]: I do not believe there would be a life without death, but who cares about my wee tiff?
        - paragraph [ref=f17e84]: And if eventually that is attainable, then humans will be buzzin and some others would be chuffed, and that comes with a price; the rich can now live long and never die, and maybe accumulate more wealth like vampires, hahahah.
        - paragraph [ref=f17e85]:
          - text: Then there would be me writing letters to Bonnie Lass in different places, and the word would no longer be “Maybe we can spend 80years together”, it would be “We can spend forever together, as death is a joke and now finito)And for what it is, I’m not sure we can attain that, so this is a myth.
          - strong [ref=f17e86]: Don’t Die
        - paragraph [ref=f17e87]:
          - text: If you see the image above, it is a photo of a tech entrepreneur and VC called
          - link [ref=f17e88] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/Bryan_Johnson
            - strong [ref=f17e89]: Bryan Johnson
          - text: with his Son.
          - code [ref=f17e90]: Bryan Johnson’s ultimate goal is to "make death an option" and achieve human immortality by 2039. He aims to reverse human biological aging, using data-driven, algorithmic methods to align the human body with modern technological and scientific advancements.
          - text: And it is summarised by his philosophy called
          - strong [ref=f17e91]: “Don't Die”,
          - text: which you can see up there.
        - paragraph
        - paragraph [ref=f17e92]: I came across Bryan Johnson some years ago, and was like, “What is the problem of humanity?” hahahah. Bryan Johnson has been putting in the work, Millions of dollars and has been on some diets and testing nearly everything he eats. At this point, Messr Bryan might have turned himself into a lab rat, but what can one say? Free will is free will. Bryan Johnson has even participated in a multi-generational blood plasma exchange with his son and his father, to slow ageing, or so. If death became optional and humans could live forever, Earth would eventually become too crowded for us to all live here. At some point, we would either have to strictly control births (because putting on a rubber would no longer be enough), expand into space, or face conflicts over limited resources.
        - paragraph [ref=f17e93]:
          - emphasis [ref=f17e94]: Can death become obsolete? Maybe. Can humanity prove it? Not today.Because Humanity has conquered diseases, crossed oceans, split atoms, and reached the Moon.
        - paragraph [ref=f17e95]:
          - emphasis [ref=f17e96]: Yet despite all our achievements, every person who has ever lived has lost the same battle.
        - paragraph [ref=f17e97]:
          - emphasis [ref=f17e98]: Death remains undefeated.
          - strong [ref=f17e99]: "NB:"
          - text: These are just my own thoughts and opinions, so dinnae take them as facts.
